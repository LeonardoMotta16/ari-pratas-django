{% extends 'painel/base.html' %}

{% block title %}{% if categoria %}Editar Categoria{% else %}Nova Categoria{% endif %}{% endblock %}

{% block content %}
<div class="page-header">
  <h2>{% if categoria %}Editar Categoria{% else %}Nova Categoria{% endif %}</h2>
</div>

<div class="secao" style="max-width:500px;">
  <form method="post">
    {% csrf_token %}
    <div style="margin-bottom:1.2rem;">
      <label style="display:block; font-size:0.78rem; letter-spacing:1px; text-transform:uppercase; color:#999; margin-bottom:0.5rem;">Nome</label>
      <input type="text" name="nome" value="{{ categoria.nome|default:'' }}" required
        style="width:100%; padding:0.8rem 1rem; border:1px solid #ddd; font-family:'Georgia',serif; font-size:0.9rem;">
    </div>
    <div style="margin-bottom:1.5rem;">
      <label style="display:block; font-size:0.78rem; letter-spacing:1px; text-transform:uppercase; color:#999; margin-bottom:0.5rem;">Ícone (emoji)</label>
      <input type="text" name="icone" value="{{ categoria.icone|default:'' }}" placeholder="Ex: 💍"
        style="width:100%; padding:0.8rem 1rem; border:1px solid #ddd; font-family:'Georgia',serif; font-size:0.9rem;">
    </div>
    <div style="display:flex; gap:1rem;">
      <button type="submit" class="btn-novo">Salvar</button>
      <a href="{% url 'painel:categorias_lista' %}" style="padding:0.7rem 1.5rem; background:#eee; color:#333; text-decoration:none; font-size:0.78rem; letter-spacing:1px; text-transform:uppercase;">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
