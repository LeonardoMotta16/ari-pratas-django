{% extends 'painel/base.html' %}

{% block title %}Deletar Categoria{% endblock %}

{% block content %}
<div class="page-header">
  <h2>Deletar Categoria</h2>
</div>

<div class="secao" style="max-width:500px;">
  <p style="margin-bottom:1.5rem;">Tem certeza que deseja deletar a categoria <strong>{{ categoria.nome }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <div style="display:flex; gap:1rem;">
      <button type="submit" class="btn-novo" style="background:#c62828;">Sim, deletar</button>
      <a href="{% url 'painel:categorias_lista' %}" style="padding:0.7rem 1.5rem; background:#eee; color:#333; text-decoration:none; font-size:0.78rem; letter-spacing:1px; text-transform:uppercase;">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
